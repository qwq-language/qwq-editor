name: Build Editor

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  prepare-wasm:
    name: Build WASM from latest qwqwq
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      editor-version: ${{ steps.editor_version.outputs.version }}
    steps:
      - name: Check out qwq-editor
        uses: actions/checkout@v7

      - name: Check out latest qwqwq
        uses: actions/checkout@v7
        with:
          repository: qwq-language/qwqwq
          ref: main
          path: qwqwq-source
          fetch-depth: 1

      - name: Read qwq-editor version
        id: editor_version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ -z "$version" ]]; then
            echo "Could not read version from package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read qwqwq version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/.*kVersion = "([^"]+)".*/\1/p' qwqwq-source/src/include/version.hpp | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not read kVersion from qwqwq-source/src/include/version.hpp" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.1
          actions-cache-folder: emsdk-cache

      - name: Install editor dependencies
        run: npm ci

      - name: Read committed WASM version
        id: committed
        shell: bash
        run: |
          version=""
          if [[ -f src/wasm/qwq.wasm ]]; then
            version="$(node scripts/wasm-version.cjs src/wasm 2>/dev/null || true)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build analysis-only WASM for desktop
        run: npm run build:analysis-wasm:source
        env:
          QWQ_ROOT_DIR: ${{ github.workspace }}/qwqwq-source

      - name: Build full WASM for online execution
        run: npm run build:wasm:source
        env:
          QWQ_ROOT_DIR: ${{ github.workspace }}/qwqwq-source

      - name: Warn when the committed WASM snapshot is behind upstream
        shell: bash
        env:
          COMMITTED_VERSION: ${{ steps.committed.outputs.version }}
          UPSTREAM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$COMMITTED_VERSION" ]]; then
            echo "::warning::The committed WASM snapshot does not report a version. Rebuild it with QWQ_REBUILD_WASM=1 and commit src/wasm and src/wasm-analysis."
          elif [[ "$COMMITTED_VERSION" != "$UPSTREAM_VERSION" ]]; then
            echo "::warning::Committed WASM reports qwqwq $COMMITTED_VERSION but upstream main is $UPSTREAM_VERSION. Pages and the release archives use $UPSTREAM_VERSION; rebuild the committed snapshot with QWQ_REBUILD_WASM=1 so local builds are not stale."
          else
            echo "Committed WASM matches upstream main ($UPSTREAM_VERSION)."
          fi

      - name: Stage WASM assets
        shell: bash
        run: |
          mkdir -p wasm-assets/wasm wasm-assets/wasm-analysis
          cp src/wasm/qwq.js src/wasm/qwq.wasm wasm-assets/wasm/
          cp src/wasm-analysis/qwq.js src/wasm-analysis/qwq.wasm wasm-assets/wasm-analysis/

      - name: Upload WASM assets
        uses: actions/upload-artifact@v7
        with:
          name: qwq-editor-wasm-${{ steps.version.outputs.version }}
          path: wasm-assets
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Package desktop app (${{ matrix.os }})
    needs: prepare-wasm
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Check out qwq-editor
        uses: actions/checkout@v7

      - name: Download latest WASM assets
        uses: actions/download-artifact@v8
        with:
          name: qwq-editor-wasm-${{ needs.prepare-wasm.outputs.version }}
          path: src

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install editor dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run build:electron

      - name: Set release-compatible artifact suffix
        id: suffix
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) suffix="x86_64-pc-windows-msvc-release" ;;
            Linux) suffix="x86_64-unknown-linux-gnu-gcc-release" ;;
            macOS) suffix="$(uname -m)-apple-darwin-appleclang-release" ;;
            *) echo "Unsupported runner: $RUNNER_OS" >&2; exit 1 ;;
          esac
          echo "value=$suffix" >> "$GITHUB_OUTPUT"

      - name: Collect release assets
        shell: bash
        env:
          ARTIFACT_SUFFIX: ${{ steps.suffix.outputs.value }}
        run: |
          node scripts/release-assets.cjs --suffix "$ARTIFACT_SUFFIX"

      - name: Upload desktop package
        uses: actions/upload-artifact@v7
        with:
          name: qwq-editor-${{ needs.prepare-wasm.outputs.editor-version }}-${{ steps.suffix.outputs.value }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  pages:
    name: Deploy online editor with execution to GitHub Pages
    needs: prepare-wasm
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out qwq-editor
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Download latest full WASM
        uses: actions/download-artifact@v8
        with:
          name: qwq-editor-wasm-${{ needs.prepare-wasm.outputs.version }}
          path: src

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install editor dependencies
        run: npm ci

      - name: Set GitHub Pages base path
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [[ -z "$PAGES_BASE_PATH" || "$PAGES_BASE_PATH" == "/" ]]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=${PAGES_BASE_PATH%/}/" >> "$GITHUB_ENV"
          fi

      - name: Build editor with online execution
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Attach desktop packages to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare-wasm, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v8
        with:
          pattern: qwq-editor-${{ needs.prepare-wasm.outputs.editor-version }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify release packages
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release-assets/*)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No desktop release packages were downloaded." >&2
            exit 1
          fi
          ls -lh release-assets

      - name: Attach packages to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
